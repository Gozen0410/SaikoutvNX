name: Bootstrap Switch Port

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-switch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Transfer Switch port from SaikouTV
        run: |
          set -eux
          rm -rf /tmp/SaikouTV-source
          git clone --depth 1 --branch feature/api-source-page https://github.com/Gozen0410/SaikouTV.git /tmp/SaikouTV-source

          rm -rf switch
          cp -a /tmp/SaikouTV-source/switch ./switch
          cp /tmp/SaikouTV-source/LICENSE.md ./LICENSE.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add switch LICENSE.md
          git commit -m 'Transfer Switch port from SaikouTV'
          git push origin HEAD:main
