name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch networking dependency
        run: |
          set -eux
          dkp-pacman -S --needed --noconfirm switch-curl
          test -f "${DEVKITPRO}/portlibs/switch/lib/libcurl.a"
          test -f "${DEVKITPRO}/portlibs/switch/include/curl/curl.h"

      - name: Fetch Borealis
        run: |
          set -eux
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git checkout 7ae6c2826be5f9db5140a093c8fb8832ae356919
          cd ../..
          rm -rf /tmp/saikou-romfs
          cp -a switch/romfs /tmp/saikou-romfs
          rm -rf switch/romfs
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/
          cp -a /tmp/saikou-romfs/. switch/romfs/
          rm -rf /tmp/saikou-romfs

      - name: Apply committed Borealis compatibility patch
        run: |
          set -eux
          git -C switch/borealis apply ../patches/borealis-switch-compat.patch
          grep -q 'swkbdConfigSetInitialText' switch/borealis/library/lib/platforms/switch/swkbd.cpp
          if grep -q 'swkbdConfigSetStringLenMaxExt(&config, 1);' switch/borealis/library/lib/platforms/switch/swkbd.cpp; then
            echo 'Borealis compatibility patch was not applied'
            exit 1
          fi

      - name: Test AniList parser on host
        run: |
          set -eux
          g++ -std=c++17 -Wall -Wextra -pedantic \
            -Iswitch/source \
            switch/source/json.cpp \
            switch/source/anilist_parser.cpp \
            switch/tools/test_anilist_parser.cpp \
            -o /tmp/test_anilist_parser
          /tmp/test_anilist_parser

      - name: Verify layered source tree
        run: |
          set -eux
          test -f switch/source/app.cpp
          test -f switch/source/anilist.cpp
          test -f switch/source/anilist_parser.cpp
          test -f switch/source/json.cpp
          test -f switch/source/home.cpp
          test -f switch/source/image_cache.cpp
          grep -q 'CPPFILES := $(filter-out main.cpp' switch/Makefile
          if grep -R 'miruro.zenos.my.id/trending' switch/source/anilist.cpp switch/source/home.cpp switch/source/app.cpp; then
            echo 'Miruro leaked into the AniList/Home layer'
            exit 1
          fi

      - name: Build Switch ELF
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          test -f romfs/xml/activity/main.xml
          make clean
          make -j2 V=1
          test -s saikou_switch.elf
          test -s saikou_switch.nacp

      - name: Package NRO with explicit ROMFS
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          test -f romfs/xml/activity/main.xml
          rm -f saikou_switch.nro
          "${DEVKITPRO}/tools/bin/elf2nro" \
            saikou_switch.elf \
            saikou_switch.nro \
            --nacp=saikou_switch.nacp \
            --romfsdir="${PWD}/romfs"
          test -s saikou_switch.nro
          ls -lh saikou_switch.elf saikou_switch.nacp saikou_switch.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaikouTV-NRO
          path: switch/saikou_switch.nro
          if-no-files-found: error
          retention-days: 14
