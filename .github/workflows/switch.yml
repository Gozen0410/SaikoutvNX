name: Switch Homebrew

on:
  push:
    paths:
      - 'switch/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260215
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch networking dependency
        run: |
          set -eux
          dkp-pacman -S --needed --noconfirm switch-curl
          test -f "${DEVKITPRO}/portlibs/switch/lib/libcurl.a"
          test -f "${DEVKITPRO}/portlibs/switch/include/curl/curl.h"

      - name: Fetch Borealis
        run: |
          set -eux
          git clone --depth 1 --recurse-submodules https://github.com/Gozen0410/borealis.git switch/borealis
          cd switch/borealis
          git fetch --depth 1 origin 7ae6c2826be5f9db5140a093c8fb8832ae356919
          git checkout 7ae6c2826be5f9db5140a093c8fb8832ae356919
          cd ../..
          rm -rf /tmp/saikou-romfs
          cp -a switch/romfs /tmp/saikou-romfs
          rm -rf switch/romfs
          mkdir -p switch/romfs
          cp -a switch/borealis/resources/. switch/romfs/
          cp -a /tmp/saikou-romfs/. switch/romfs/
          rm -rf /tmp/saikou-romfs

      - name: Apply minimal Borealis compatibility patch
        working-directory: switch/borealis
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path

          p = Path('library/lib/platforms/switch/swkbd.cpp')
          lines = p.read_text().splitlines()
          needle = 'swkbdConfigSetStringLenMaxExt(&config, 1);'
          p.write_text('\n'.join(line for line in lines if needle not in line) + '\n')

          # Keep TabFrame's tab views alive. The stock Borealis TabFrame destroys
          # the active view whenever the sidebar changes, which also destroys
          # runtime Home state. Reusing the same view is enough to preserve
          # Home's AniList cards and focus state without custom routing.
          p = Path('library/include/borealis/views/tab_frame.hpp')
          s = p.read_text()
          if 'std::vector<View*> tabs;' not in s:
              s = s.replace('#include <functional>\n', '#include <functional>\n#include <vector>\n', 1)
              s = s.replace('    View* activeTab = nullptr;\n', '    View* activeTab = nullptr;\n    std::vector<View*> tabs;\n', 1)
              p.write_text(s)

          p = Path('library/lib/views/tab_frame.cpp')
          s = p.read_text()
          old = '''void TabFrame::addTab(std::string label, TabViewCreator creator)
{
    this->sidebar->addItem(label, [this, creator](brls::View* view) {
        // Only trigger when the sidebar item gains focus
        if (!view->isFocused())
            return;

        Box* contentView = (Box*)this->contentView;

        // Remove the existing tab if it exists
        if (this->activeTab)
        {
            contentView->removeView(this->activeTab); // will call willDisappear and delete
            this->activeTab = nullptr;
        }

        // Add the new tab
        View* newContent = creator();

        if (!newContent)
            return;

        newContent->setGrow(1.0f);
        contentView->addView(newContent); // addView calls willAppear

        this->activeTab = newContent;
    });
}
'''
          new = '''void TabFrame::addTab(std::string label, TabViewCreator creator)
{
    const size_t tabIndex = this->tabs.size();
    this->tabs.push_back(nullptr);

    this->sidebar->addItem(label, [this, creator, tabIndex](brls::View* view) {
        // Only trigger when the sidebar item gains focus.
        if (!view->isFocused())
            return;

        Box* contentView = (Box*)this->contentView;
        if (!contentView)
            return;

        // Keep every tab view alive. Only its visibility changes, so runtime
        // state owned by a screen survives sidebar navigation.
        if (this->activeTab && this->activeTab != this->tabs[tabIndex])
            this->activeTab->setVisibility(Visibility::GONE);

        View* tab = this->tabs[tabIndex];
        if (!tab)
        {
            tab = creator();
            if (!tab)
                return;

            tab->setGrow(1.0f);
            contentView->addView(tab);
            this->tabs[tabIndex] = tab;
        }

        tab->setVisibility(Visibility::VISIBLE);
        this->activeTab = tab;
    });
}
'''
          if old not in s:
              raise SystemExit('Could not locate original TabFrame addTab implementation')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply AniList Home data source
        run: |
          set -eux
          python3 -m py_compile switch/tools/apply_anilist_home.py
          python3 switch/tools/apply_anilist_home.py
          test -f switch/source/main.cpp
          grep -q 'ANILIST HOME REQUEST' switch/source/main.cpp
          grep -q 'graphql.anilist.co' switch/source/main.cpp
          if grep -q 'miruro.zenos.my.id/trending' switch/source/main.cpp; then
            echo 'Unexpected Miruro Home endpoint after clean AniList migration'
            exit 1
          fi

      - name: Verify clean navigation foundation
        run: |
          set -eux
          test -f switch/romfs/xml/activity/main.xml
          grep -q '<brls:Tab label="Home">' switch/romfs/xml/activity/main.xml
          grep -q '<brls:Tab label="Search">' switch/romfs/xml/activity/main.xml
          grep -q '<brls:Tab label="Library">' switch/romfs/xml/activity/main.xml
          grep -q '<brls:Tab label="Settings">' switch/romfs/xml/activity/main.xml
          if grep -q 'AnimeDetailsActivity\|ApiSourceActivity\|g_activeSidebarItem\|g_refreshRequested' switch/source/main.cpp; then
            echo 'Legacy experimental navigation state leaked into clean foundation'
            exit 1
          fi

      - name: Build ELF
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          test -f romfs/xml/activity/main.xml
          make clean
          make -j2 V=1
          ls -lh saikou_switch.elf saikou_switch.nacp

      - name: Package NRO
        working-directory: switch
        run: |
          set -eux
          test -d romfs
          rm -f saikou_switch.nro
          "${DEVKITPRO}/tools/bin/elf2nro" saikou_switch.elf saikou_switch.nro --nacp=saikou_switch.nacp --romfsdir="${PWD}/romfs"
          test -s saikou_switch.nro
          ls -lh saikou_switch.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: saikou-switch
          path: switch/saikou_switch.nro
